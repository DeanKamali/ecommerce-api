production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  weekly_report:
    class: ReportJob
    args: ["weekly"]
    schedule: every week on Monday at 0:05
  monthly_report:
    class: ReportJob
    args: ["monthly"]
    schedule: every month on the 1st at 0:10
